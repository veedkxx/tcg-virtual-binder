name: CI

on:
  push:
    branches: [master, 'sprint-*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: typecheck da API como na Vercel
        run: npx tsc -p tsconfig.server.json --noEmit --strict false
      - run: npm run lint
      - run: npm test
      - run: npm run build
